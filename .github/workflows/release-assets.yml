name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CODEX_WINDOWS_X64_MSIX_URL: "https://codexapp.agentsmirror.com/latest/win-x64"
      CODEX_WINDOWS_X64_MSIX_CACHE_KEY: "2026-06-30"
      NODE_RUNTIME_VERSION: "v24.18.0"
      NODE_WINDOWS_X64_ZIP_URL: "https://nodejs.org/dist/v24.18.0/node-v24.18.0-win-x64.zip"
      PYTHON_WINDOWS_X64_INSTALLER_URL: "https://www.python.org/ftp/python/3.13.14/python-3.13.14-amd64.exe"
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/codex-plus-manager/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          key: release-windows-x64-${{ hashFiles('Cargo.lock') }}
          cache-on-failure: true

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install NSIS with retry
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Chocolatey failed to install NSIS on attempt $attempt."
              Start-Sleep -Seconds (10 * $attempt)
              continue
            }
            $installed = $true
            break
          }
          if (-not $installed) {
            throw "Chocolatey failed to install NSIS after retries."
          }

          $candidatePaths = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "${env:ProgramFiles}\NSIS\makensis.exe",
            "C:\ProgramData\chocolatey\bin\makensis.exe"
          )
          $makensis = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            $command = Get-Command makensis -ErrorAction SilentlyContinue
            if ($command) {
              $makensis = $command.Source
            }
          }
          if (-not $makensis) {
            throw "NSIS makensis.exe was not found"
          }
          "NSIS_MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build binaries
        run: cargo build --release

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Stage Windows app files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/app | Out-Null
          Copy-Item target/release/codex-plus-plus.exe dist/windows/app/
          Copy-Item target/release/codex-plus-plus-manager.exe dist/windows/app/
          if ($env:CODEX_APP_SOURCE) {
            if (-not (Test-Path $env:CODEX_APP_SOURCE)) {
              throw "CODEX_APP_SOURCE is set but does not exist: $env:CODEX_APP_SOURCE"
            }
            Copy-Item $env:CODEX_APP_SOURCE dist/windows/app/Codex -Recurse -Force
          } else {
            Write-Host "CODEX_APP_SOURCE not set; installer will rely on the management tool install flow."
          }

      - name: Cache Node Windows runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/codex-plus-release/windows/node-${{ env.NODE_RUNTIME_VERSION }}-win-x64.zip
          key: ${{ runner.os }}-node-${{ env.NODE_RUNTIME_VERSION }}-win-x64

      - name: Download Node Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist/windows/package | Out-Null
          $zip = "dist/windows/package/node-${env:NODE_RUNTIME_VERSION}-win-x64.zip"
          $cache = Join-Path $env:USERPROFILE ".cache\codex-plus-release\windows\node-${env:NODE_RUNTIME_VERSION}-win-x64.zip"
          New-Item -ItemType Directory -Force (Split-Path $cache) | Out-Null
          if (Test-Path $cache) {
            Copy-Item $cache $zip -Force
          } else {
            curl.exe -L --retry 3 --retry-delay 10 --fail -o $zip $env:NODE_WINDOWS_X64_ZIP_URL
            Copy-Item $zip $cache -Force
          }
          $size = (Get-Item $zip).Length
          if ($size -lt 20MB) {
            throw "Downloaded Node runtime is unexpectedly small: $size bytes"
          }

      - name: Embed Node Windows runtime into setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "dist/windows/package/node-${env:NODE_RUNTIME_VERSION}-win-x64.zip"
          if (-not (Test-Path $zip)) {
            throw "Missing Node runtime zip: $zip"
          }
          $dest = "dist/windows/app/resources/node"
          $extract = "dist/windows/node/extracted"
          if (Test-Path $dest) {
            Remove-Item $dest -Recurse -Force
          }
          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }
          New-Item -ItemType Directory -Force $extract | Out-Null
          $tar = Join-Path $env:WINDIR "System32\tar.exe"
          if (Test-Path $tar) {
            & $tar -xf $zip -C $extract
            if ($LASTEXITCODE -ne 0) {
              throw "Windows tar failed to extract Node runtime"
            }
          } else {
            Expand-Archive -Force -LiteralPath $zip -DestinationPath $extract
          }
          $source = Get-ChildItem -LiteralPath $extract -Directory |
            Where-Object { $_.Name -like "node-v*-win-x64" } |
            Select-Object -First 1
          if (-not $source) {
            throw "Extracted Node runtime root was not found"
          }
          New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
          Move-Item -LiteralPath $source.FullName -Destination $dest -Force
          if (-not (Test-Path "$dest/node.exe")) {
            throw "Embedded Node runtime is missing node.exe"
          }

      - name: Cache Codex Windows MSIX
        uses: actions/cache@v4
        with:
          path: ~/.cache/codex-plus-release/windows/CodexOfficialApp-x64.msix
          key: ${{ runner.os }}-codex-windows-msix-${{ env.CODEX_WINDOWS_X64_MSIX_CACHE_KEY }}

      - name: Download Codex Windows MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist/windows/package | Out-Null
          $msix = "dist/windows/package/CodexOfficialApp-x64.msix"
          $cache = Join-Path $env:USERPROFILE ".cache\codex-plus-release\windows\CodexOfficialApp-x64.msix"
          New-Item -ItemType Directory -Force (Split-Path $cache) | Out-Null
          if (Test-Path $cache) {
            Copy-Item $cache $msix -Force
          } else {
            curl.exe -L --retry 3 --retry-delay 10 --fail -o $msix $env:CODEX_WINDOWS_X64_MSIX_URL
            Copy-Item $msix $cache -Force
          }
          $size = (Get-Item $msix).Length
          if ($size -lt 100MB) {
            throw "Downloaded Codex MSIX is unexpectedly small: $size bytes"
          }

      - name: Cache Python Windows installer
        uses: actions/cache@v4
        with:
          path: ~/.cache/codex-plus-release/windows/python-3.13.14-amd64.exe
          key: ${{ runner.os }}-python-3.13.14-amd64

      - name: Download Python Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist/windows/package | Out-Null
          $python = "dist/windows/package/python-3.13.14-amd64.exe"
          $cache = Join-Path $env:USERPROFILE ".cache\codex-plus-release\windows\python-3.13.14-amd64.exe"
          New-Item -ItemType Directory -Force (Split-Path $cache) | Out-Null
          if (Test-Path $cache) {
            Copy-Item $cache $python -Force
          } else {
            curl.exe -L --retry 3 --retry-delay 10 --fail -o $python $env:PYTHON_WINDOWS_X64_INSTALLER_URL
            Copy-Item $python $cache -Force
          }
          $size = (Get-Item $python).Length
          if ($size -lt 20MB) {
            throw "Downloaded Python installer is unexpectedly small: $size bytes"
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ github.event.release.tag_name }}".TrimStart("v", "V")
          $makensis = $env:NSIS_MAKENSIS
          if (-not $makensis -or -not (Test-Path $makensis)) {
            $command = Get-Command makensis -ErrorAction SilentlyContinue
            if ($command) {
              $makensis = $command.Source
            }
          }
          if (-not $makensis -or -not (Test-Path $makensis)) {
            throw "NSIS makensis.exe was not found"
          }
          Push-Location scripts/installer/windows
          & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$version" "/DUPDATE_ONLY=1" CodexPlusPlus.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS updater build failed" }
          & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$version" "/DONLINE_COMPONENTS=1" CodexPlusPlus.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS online installer build failed" }
          & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$version" CodexPlusPlus.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS offline setup build failed" }
          Pop-Location

      - name: Build Windows ZIP package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ github.event.release.tag_name }}".TrimStart("v", "V")
          $setup = "dist/windows/CodexPlusOfficial-${version}-windows-x64-setup.exe"
          $msix = "dist/windows/package/CodexOfficialApp-x64.msix"
          $python = "dist/windows/package/python-3.13.14-amd64.exe"
          $node = "dist/windows/package/node-${env:NODE_RUNTIME_VERSION}-win-x64.zip"
          if (-not (Test-Path $setup)) {
            throw "Missing setup executable: $setup"
          }
          if (-not (Test-Path $msix)) {
            throw "Missing Codex MSIX: $msix"
          }
          if (-not (Test-Path $python)) {
            throw "Missing Python installer: $python"
          }
          if (-not (Test-Path $node)) {
            throw "Missing Node runtime: $node"
          }
          $packageRoot = "dist/windows/package-root"
          if (Test-Path $packageRoot) {
            Remove-Item $packageRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force $packageRoot | Out-Null
          $resourcesDir = "$packageRoot/RequiredFiles"
          New-Item -ItemType Directory -Force $resourcesDir | Out-Null
          Copy-Item $setup "$packageRoot/点我双击安装.exe"
          Copy-Item $msix "$resourcesDir/CodexOfficialApp-x64.msix"
          Copy-Item $python "$resourcesDir/python-3.13.14-amd64.exe"
          Copy-Item $node "$resourcesDir/node-${env:NODE_RUNTIME_VERSION}-win-x64.zip"
          $rootNames = @(Get-ChildItem -LiteralPath $packageRoot -Force | ForEach-Object { $_.Name } | Sort-Object)
          $expectedRootNames = @("RequiredFiles", "点我双击安装.exe")
          if (@(Compare-Object $rootNames $expectedRootNames).Length -ne 0) {
            throw "Invalid package root entries: $($rootNames -join ', ')"
          }
          $rootExe = @(Get-ChildItem -LiteralPath $packageRoot -File -Filter *.exe)
          if ($rootExe.Count -ne 1 -or $rootExe[0].Name -ne "点我双击安装.exe") {
            throw "Package root must contain exactly one setup executable"
          }
          if (-not (Test-Path "$resourcesDir/CodexOfficialApp-x64.msix")) {
            throw "Package resources are missing CodexOfficialApp-x64.msix"
          }
          if (-not (Test-Path "$resourcesDir/python-3.13.14-amd64.exe")) {
            throw "Package resources are missing python-3.13.14-amd64.exe"
          }
          if (-not (Test-Path "$resourcesDir/node-${env:NODE_RUNTIME_VERSION}-win-x64.zip")) {
            throw "Package resources are missing node-${env:NODE_RUNTIME_VERSION}-win-x64.zip"
          }
          Compress-Archive -Force -Path "$packageRoot/*" -DestinationPath "dist/windows/CodexPlusOfficial-${version}-windows-x64.zip"

      - name: Upload Windows assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/windows/*.zip
            dist/windows/*-setup.exe
            dist/windows/*-online.exe
            dist/windows/*-updater.exe

  macos-dmg:
    name: macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      NODE_RUNTIME_VERSION: "v24.18.0"
      CODEX_MACOS_APP_CACHE_KEY: "2026-07-07-2"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            node_arch: x64
            codex_app_url: https://codexapp.agentsmirror.com/latest/mac-intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            node_arch: arm64
            codex_app_url: https://codexapp.agentsmirror.com/latest/mac-arm64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/codex-plus-manager/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          key: release-macos-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          cache-on-failure: true

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Cache Node macOS runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/codex-plus-release/macos/node-${{ env.NODE_RUNTIME_VERSION }}-darwin-${{ matrix.node_arch }}.tar.gz
          key: ${{ runner.os }}-node-${{ env.NODE_RUNTIME_VERSION }}-darwin-${{ matrix.node_arch }}

      - name: Download Node macOS runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/macos/package ~/.cache/codex-plus-release/macos
          tarball="dist/macos/package/node-${NODE_RUNTIME_VERSION}-darwin-${{ matrix.node_arch }}.tar.gz"
          cache="$HOME/.cache/codex-plus-release/macos/node-${NODE_RUNTIME_VERSION}-darwin-${{ matrix.node_arch }}.tar.gz"
          url="https://nodejs.org/dist/${NODE_RUNTIME_VERSION}/node-${NODE_RUNTIME_VERSION}-darwin-${{ matrix.node_arch }}.tar.gz"
          if [ -f "$cache" ]; then
            cp "$cache" "$tarball"
          else
            curl -L --retry 3 --retry-delay 10 --fail -o "$tarball" "$url"
            cp "$tarball" "$cache"
          fi
          size="$(stat -f '%z' "$tarball")"
          if [ "$size" -lt 20000000 ]; then
            echo "Downloaded Node runtime is unexpectedly small: $size bytes" >&2
            exit 1
          fi
          node_extract="$RUNNER_TEMP/codex-plus-node-${{ matrix.arch }}"
          rm -rf "$node_extract"
          mkdir -p "$node_extract"
          tar -xzf "$tarball" -C "$node_extract"
          node_root="$(find "$node_extract" -maxdepth 1 -type d -name "node-${NODE_RUNTIME_VERSION}-darwin-${{ matrix.node_arch }}" -print -quit)"
          if [ -z "$node_root" ] || [ ! -x "$node_root/bin/node" ]; then
            echo "Extracted Node runtime is missing bin/node" >&2
            exit 1
          fi
          echo "NODE_RUNTIME_SOURCE=$node_root" >> "$GITHUB_ENV"

      - name: Cache Codex macOS app DMG
        uses: actions/cache@v4
        with:
          path: ~/.cache/codex-plus-release/macos/CodexOfficialApp-${{ matrix.arch }}.dmg
          key: ${{ runner.os }}-codex-macos-${{ matrix.arch }}-${{ env.CODEX_MACOS_APP_CACHE_KEY }}

      - name: Download Codex macOS app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/macos/package ~/.cache/codex-plus-release/macos
          dmg="dist/macos/package/CodexOfficialApp-${{ matrix.arch }}.dmg"
          cache="$HOME/.cache/codex-plus-release/macos/CodexOfficialApp-${{ matrix.arch }}.dmg"
          if [ -f "$cache" ]; then
            cp "$cache" "$dmg"
          else
            urls=("${{ matrix.codex_app_url }}")
            if [ "${{ matrix.arch }}" = "x64" ]; then
              urls+=(
                "https://codexapp.agentsmirror.com/latest/mac-x64"
                "https://codexapp.agentsmirror.com/latest/macos-x64"
                "https://codexapp.agentsmirror.com/latest/darwin-x64"
              )
            fi
            downloaded=0
            for url in "${urls[@]}"; do
              echo "Downloading Codex macOS app from $url"
              if curl -L --retry 3 --retry-delay 10 --fail -o "$dmg" "$url"; then
                downloaded=1
                break
              fi
              rm -f "$dmg"
            done
            if [ "$downloaded" -ne 1 ]; then
              echo "Failed to download Codex macOS app from all configured URLs" >&2
              exit 1
            fi
            cp "$dmg" "$cache"
          fi
          size="$(stat -f '%z' "$dmg")"
          if [ "$size" -lt 80000000 ]; then
            echo "Downloaded Codex macOS app DMG is unexpectedly small: $size bytes" >&2
            exit 1
          fi
          mount_dir="$RUNNER_TEMP/codex-app-${{ matrix.arch }}-mount"
          source_dir="$RUNNER_TEMP/codex-app-${{ matrix.arch }}-source"
          rm -rf "$mount_dir" "$source_dir"
          mkdir -p "$mount_dir" "$source_dir"
          hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -readonly
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          codex_app="$(find "$mount_dir" -maxdepth 1 -type d -name "*.app" -print -quit)"
          if [ -z "$codex_app" ]; then
            echo "Mounted Codex macOS DMG does not contain an app bundle" >&2
            exit 1
          fi
          app_name="$(basename "$codex_app")"
          ditto "$codex_app" "$source_dir/$app_name"
          cleanup
          trap - EXIT
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$source_dir/$app_name/Contents/Info.plist")"
          if [ -z "$executable" ] || [ ! -x "$source_dir/$app_name/Contents/MacOS/$executable" ]; then
            echo "Extracted Codex macOS app is missing its bundle executable" >&2
            exit 1
          fi
          echo "CODEX_APP_SOURCE=$source_dir/$app_name" >> "$GITHUB_ENV"

      - name: Build macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          version="${version#V}"
          BINARY_DIR="$PWD/target/${{ matrix.target }}/release" \
          CODEX_APP_SOURCE="$CODEX_APP_SOURCE" \
          NODE_RUNTIME_SOURCE="$NODE_RUNTIME_SOURCE" \
          bash scripts/installer/macos/package-dmg.sh "$version" "${{ matrix.arch }}"

      - name: Verify macOS bundle structure
        shell: bash
        run: |
          set -euo pipefail
          test -L "dist/macos/stage/Applications"
          test "$(readlink "dist/macos/stage/Applications")" = "/Applications"
          app="dist/macos/stage/Codex官方管理工具.app"
          test -f "$app/Contents/Info.plist"
          test -f "$app/Contents/PkgInfo"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          test -x "$app/Contents/MacOS/$executable"
          test -x "$app/Contents/MacOS/codex-plus-plus"
          test -x "$app/Contents/Resources/node/bin/node"
          bundled_codex="$(find "$app/Contents/Resources" -maxdepth 1 -type d -name "*.app" -print -quit)"
          test -n "$bundled_codex"
          bundled_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundled_codex/Contents/Info.plist")"
          test -x "$bundled_codex/Contents/MacOS/$bundled_executable"
          plutil -lint "$app/Contents/Info.plist" >/dev/null
          codesign -dv "$app" >/dev/null 2>&1
          hdiutil verify dist/macos/*.dmg

      - name: Upload macOS DMG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/macos/*.dmg

  latest-json:
    name: Upload static latest.json
    runs-on: ubuntu-latest
    needs:
      - windows-installer
      - macos-dmg
    steps:
      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          PUBLIC_DOWNLOAD_BASE_URL: https://leishenai.cn/tools/codex-plus/releases
          CODEX_WINDOWS_X64_MSIX_URL: https://codexapp.agentsmirror.com/latest/win-x64
          CODEX_MACOS_ARM64_DMG_URL: https://codexapp.agentsmirror.com/latest/mac-arm64
          CODEX_MACOS_X64_DMG_URL: https://codexapp.agentsmirror.com/latest/mac-intel
          NODE_RUNTIME_VERSION: v24.18.0
          NODE_MACOS_ARM64_TAR_URL: https://nodejs.org/dist/v24.18.0/node-v24.18.0-darwin-arm64.tar.gz
          NODE_MACOS_X64_TAR_URL: https://nodejs.org/dist/v24.18.0/node-v24.18.0-darwin-x64.tar.gz
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/tags/$TAG" > release.json
          node <<'NODE'
          const fs = require("fs");
          const release = JSON.parse(fs.readFileSync("release.json", "utf8"));
          const tag = release.tag_name || process.env.TAG;
          const version = tag.replace(/^v/i, "");
          const publicDownloadBaseUrl = String(process.env.PUBLIC_DOWNLOAD_BASE_URL || "").replace(/\/+$/, "");
          const publicAssetUrl = (assetName) => publicDownloadBaseUrl
            ? `${publicDownloadBaseUrl}/${tag}/${assetName}`
            : undefined;
          const rawAssets = (release.assets || [])
            .filter((asset) => asset.name !== "latest.json")
            .filter((asset) => asset.name !== "download-latest.json")
            .filter((asset) => asset.name !== "components.json")
            .map((asset) => {
              const lower = String(asset.name || "").toLowerCase();
              const digest = typeof asset.digest === "string" ? asset.digest : "";
              const sha256 = digest.toLowerCase().startsWith("sha256:") ? digest.slice("sha256:".length) : undefined;
              const name = asset.name;
              const url = publicAssetUrl(name) || asset.browser_download_url;
              const platform = name.toLowerCase().includes("macos") || name.toLowerCase().endsWith(".dmg") ? "macos" : "windows";
              const arch = name.toLowerCase().includes("arm64") || name.toLowerCase().includes("aarch64") ? "arm64" : "x64";
              const purpose = lower.endsWith("-updater.exe")
                ? "updater"
                : lower.endsWith("-online.exe")
                  ? "installer"
                  : lower.endsWith(".dmg")
                    ? "installer"
                  : lower.endsWith(".zip")
                    ? "offline"
                    : lower.endsWith("-setup.exe")
                      ? "offline-setup"
                      : "download";
              return {
                name,
                platform,
                arch,
                purpose,
                size: asset.size,
                url,
                browser_download_url: url,
                ...(sha256 ? { sha256 } : {})
              };
            })
            .sort((left, right) => {
              const platformOrder = { windows: 0, macos: 1 };
              const purposeOrder = { updater: 0, installer: 1, offline: 2, "offline-setup": 3, download: 4 };
              return (platformOrder[left.platform] ?? 9) - (platformOrder[right.platform] ?? 9)
                || (purposeOrder[left.purpose] ?? 9) - (purposeOrder[right.purpose] ?? 9)
                || left.name.localeCompare(right.name);
            });
          const legacyWindowsUpdaterAliases = rawAssets
            .filter((asset) => asset.platform === "windows" && asset.purpose === "updater")
            .map((asset) => ({
              ...asset,
              name: asset.name.replace(/-updater\.exe$/i, "-legacy-setup.exe"),
              purpose: "legacy-updater"
            }));
          const latestPayload = {
            version: `v${version}`,
            url: release.html_url || `https://github.com/${process.env.REPO}/releases/tag/${tag}`,
            body: release.body || "",
            assets: [
              ...rawAssets.filter((asset) => asset.purpose === "updater"),
              ...rawAssets.filter((asset) => asset.platform === "macos" && asset.purpose === "installer"),
              ...legacyWindowsUpdaterAliases
            ]
          };
          const downloadPayload = {
            version: `v${version}`,
            url: release.html_url || `https://github.com/${process.env.REPO}/releases/tag/${tag}`,
            body: release.body || "",
            assets: rawAssets.filter((asset) => ["installer", "offline"].includes(asset.purpose))
          };
          const componentsPayload = {
            version: `v${version}`,
            components: [
              {
                id: "codex-app",
                name: "CodexOfficialApp-x64.msix",
                platform: "windows",
                arch: "x64",
                url: process.env.CODEX_WINDOWS_X64_MSIX_URL || "https://codexapp.agentsmirror.com/latest/win-x64"
              },
              {
                id: "python",
                name: "python-3.13.14-amd64.exe",
                platform: "windows",
                arch: "x64",
                url: process.env.PYTHON_WINDOWS_X64_INSTALLER_URL || "https://www.python.org/ftp/python/3.13.14/python-3.13.14-amd64.exe"
              },
              {
                id: "node-runtime",
                name: "node-v24.18.0-win-x64.zip",
                platform: "windows",
                arch: "x64",
                url: process.env.NODE_WINDOWS_X64_ZIP_URL || "https://nodejs.org/dist/v24.18.0/node-v24.18.0-win-x64.zip"
              },
              {
                id: "codex-app-macos-arm64",
                name: "Codex-mac-arm64.dmg",
                platform: "macos",
                arch: "arm64",
                url: process.env.CODEX_MACOS_ARM64_DMG_URL || "https://codexapp.agentsmirror.com/latest/mac-arm64"
              },
              {
                id: "codex-app-macos-x64",
                name: "Codex-mac-x64.dmg",
                platform: "macos",
                arch: "x64",
                url: process.env.CODEX_MACOS_X64_DMG_URL || "https://codexapp.agentsmirror.com/latest/mac-intel"
              },
              {
                id: "node-runtime-macos-arm64",
                name: "node-v24.18.0-darwin-arm64.tar.gz",
                platform: "macos",
                arch: "arm64",
                url: process.env.NODE_MACOS_ARM64_TAR_URL || "https://nodejs.org/dist/v24.18.0/node-v24.18.0-darwin-arm64.tar.gz"
              },
              {
                id: "node-runtime-macos-x64",
                name: "node-v24.18.0-darwin-x64.tar.gz",
                platform: "macos",
                arch: "x64",
                url: process.env.NODE_MACOS_X64_TAR_URL || "https://nodejs.org/dist/v24.18.0/node-v24.18.0-darwin-x64.tar.gz"
              }
            ]
          };
          if (latestPayload.assets.length === 0) {
            throw new Error("latest.json must expose at least one updater asset");
          }
          if (downloadPayload.assets.length === 0) {
            throw new Error("download-latest.json must expose installer or offline download assets");
          }
          fs.writeFileSync("latest.json", `${JSON.stringify(latestPayload, null, 2)}\n`);
          fs.writeFileSync("download-latest.json", `${JSON.stringify(downloadPayload, null, 2)}\n`);
          fs.writeFileSync("components.json", `${JSON.stringify(componentsPayload, null, 2)}\n`);
          NODE
          cat latest.json
          cat download-latest.json
          cat components.json

      - name: Upload update manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload "$TAG" latest.json download-latest.json components.json --clobber --repo "$REPO"
